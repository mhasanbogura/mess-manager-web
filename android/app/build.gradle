apply plugin: 'com.android.application'

def versionFile = file('build.gradle')

task bumpVersion {
    doLast {
        def content = versionFile.text
        def versionCodeMatcher = (content =~ /versionCode (\d+)/)
        def versionNameMatcher = (content =~ /versionName "([\d.]+)"/)
        if (versionCodeMatcher.find() && versionNameMatcher.find()) {
            def oldCode = versionCodeMatcher.group(1) as int
            def oldName = versionNameMatcher.group(1)
            def newCode = oldCode + 3
            def parts = oldName.split('\\.')
            parts[parts.length - 1] = (parts[parts.length - 1] as int + 1).toString()
            def newName = parts.join('.')
            content = content.replaceFirst(/versionCode \d+/, "versionCode ${newCode}")
            content = content.replaceFirst(/versionName "[\d.]+"/, "versionName \"${newName}\"")
            versionFile.text = content
            project.ext.newVersion = newName
            project.ext.newBuild = newCode
            println "Version bumped: ${oldName} -> ${newName}, build: ${oldCode} -> ${newCode}"
        }
    }
}

tasks.whenTaskAdded { task ->
    if (task.name == 'assembleDebug') {
        task.dependsOn bumpVersion
    }
}

task release {
    dependsOn 'assembleDebug'
    doLast {
        def v = project.ext.newVersion
        def b = project.ext.newBuild
        def apkName = "Mess Manager.apk"
        def apkPath = file("${buildDir}/outputs/apk/debug/app-debug.apk")
        def tagName = "v${v}"
        def rootDir = project.projectDir.parentFile

        println "Releasing ${tagName} (build ${b})..."

        exec {
            workingDir rootDir
            commandLine 'cp', apkPath.absolutePath, "${rootDir}/${apkName}"
        }

        exec {
            workingDir rootDir
            commandLine 'git', 'add', '-A'
        }
        exec {
            workingDir rootDir
            commandLine 'git', 'commit', '-m', "v${v} build ${b}"
            ignoreExitValue = true
        }
        exec {
            workingDir rootDir
            commandLine 'git', 'push'
        }

        exec {
            workingDir rootDir
            commandLine 'gh', 'release', 'delete', tagName, '--yes'
            ignoreExitValue = true
        }
        exec {
            workingDir rootDir
            commandLine 'gh', 'release', 'create', tagName,
                apkPath.absolutePath,
                '--title', "Mess Manager v${v} (build ${b})",
                '--notes', "Mess Manager v${v} build ${b}\nPackage: com.mahmuduls.messmanager",
                '--latest'
        }

        println "Released ${tagName} on GitHub with ${apkName}"
    }
}

android {
    namespace "com.mahmuduls.messmanager"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.mahmuduls.messmanager"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 55
        versionName "1.3.12"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    configurations.all {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
